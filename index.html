<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dishcovery</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>


    <div class="video-bg">
        <video autoplay muted loop playsinline>
            <source src="./food.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>

    <nav class="navbar">
        <div class="nav-inner">
            <a class="brand" href="#">
                <span class="brand-icon">🍽</span>
                <span class="brand-name">Dishcovery</span>
            </a>
            <div class="nav-actions">
                <button class="fav-toggle-btn" id="favToggleBtn">
                    <span>❤️</span>Favourites
                </button>
                <a href="search.html">
                <button class="id">Search For Your Toungue🍱</button>
                </a>
            </div>
        </div>
    </nav>
    <div class="hero">
        <div class="hero-content">
            <p class="hero-eyebrow">Your kitchen, inspired</p>
            <h1 class="hero-title">Find Your Next<br/><em>Favourite Dish</em></h1>
            <p class="hero-sub">Thousands of recipes from cuisines around the world. Search, filter, save.</p>
        </div>
    </div>


</body>
</html>
